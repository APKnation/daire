# =============================================================================
#  NMB Credit Risk Modelling — central configuration
# =============================================================================
#  Every number that a model reviewer could challenge lives HERE, not in code.
#  The reference notebooks hardcoded thresholds inside cells (e.g. a bare
#  `df_scorecard['Score - Final'][77] = 16`); that is exactly what this file exists
#  to prevent. See agent_reviews/decisions/ADR-001-project-structure.md rule 4.
# =============================================================================

