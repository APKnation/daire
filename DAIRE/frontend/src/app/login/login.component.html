<section class="grid min-h-screen bg-[#1a1a1a] lg:grid-cols-2">
  <!-- Left panel -->
  <div class="relative hidden overflow-hidden px-12 py-12 lg:flex lg:flex-col lg:justify-between xl:px-20">
    <!-- Background hero image + dark overlay so white text stays readable -->
    <img src="assets/hero.jpg" alt="" aria-hidden="true" class="absolute inset-0 size-full object-cover">
    <div class="absolute inset-0 bg-[#1a1a1a]/70"></div>
    <!-- Brand gradients layered over the photo -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_rgba(2,74,216,0.3),_transparent_60%)]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_bottom_left,_rgba(41,110,249,0.15),_transparent_50%)]"></div>

    <!-- Logo -->
    <div class="relative flex items-center gap-4">
      <img src="assets/daire.png" alt="DAIRE" class="h-16 w-16 rounded-xl object-cover shadow-lg shadow-[#024ad8]/20">
      <div class="leading-none">
        <strong class="block text-sm font-bold tracking-[0.2em] text-white">DAIRE</strong>
        <small class="mt-2 block text-[11px] font-medium tracking-wide text-[#9a9a9a]">Credit Intelligence</small>
      </div>
    </div>

    <!-- Hero text -->
    <div class="relative max-w-2xl">
      
      <h1 class="hero-anim max-w-xl text-5xl font-bold leading-[1.08] tracking-tight text-white xl:text-6xl" style="animation-delay: 0.1s">
        Intelligent credit.
        <span class="hero-gradient mt-2 block bg-gradient-to-r from-[#296ef9] via-[#7ab8ff] to-[#024ad8] bg-clip-text text-transparent">Verified on-chain.</span>
      </h1>
      <p class="hero-anim mt-7 max-w-lg text-lg leading-relaxed text-[#c2c2c2]" style="animation-delay: 0.25s">
        One secure system for <span class="font-semibold text-white">reputation scoring</span>,
        <span class="font-semibold text-white">consent management</span>, and
        <span class="font-semibold text-white">transparent credit assessment</span>.
      </p>

      <!-- Feature list -->
      <div class="hero-anim mt-10 grid max-w-xl gap-3 sm:grid-cols-3" style="animation-delay: 0.4s">
        <span class="group flex min-h-11 items-center gap-2.5 rounded-xl border border-[#292929] bg-[#292929]/60 px-3 py-3 text-xs font-medium text-[#c2c2c2] backdrop-blur-sm transition duration-300 hover:-translate-y-1 hover:border-[#296ef9]/60 hover:bg-[#292929]/80 hover:text-white hover:shadow-lg hover:shadow-[#024ad8]/25">
          <span class="size-2 shrink-0 rounded-full bg-[#296ef9] shadow-[0_0_8px_rgba(41,110,249,0.8)] transition-transform duration-300 group-hover:scale-125"></span>
          <span>AI Reputation</span>
        </span>
        <span class="group flex min-h-11 items-center gap-2.5 rounded-xl border border-[#292929] bg-[#292929]/60 px-3 py-3 text-xs font-medium text-[#c2c2c2] backdrop-blur-sm transition duration-300 hover:-translate-y-1 hover:border-[#356373]/80 hover:bg-[#292929]/80 hover:text-white hover:shadow-lg hover:shadow-[#356373]/25">
          <span class="size-2 shrink-0 rounded-full bg-[#356373] shadow-[0_0_8px_rgba(53,99,115,0.8)] transition-transform duration-300 group-hover:scale-125"></span>
          <span>Smart Contracts</span>
        </span>
        <span class="group flex min-h-11 items-center gap-2.5 rounded-xl border border-[#292929] bg-[#292929]/60 px-3 py-3 text-xs font-medium text-[#c2c2c2] backdrop-blur-sm transition duration-300 hover:-translate-y-1 hover:border-[#024ad8]/70 hover:bg-[#292929]/80 hover:text-white hover:shadow-lg hover:shadow-[#024ad8]/25">
          <span class="size-2 shrink-0 rounded-full bg-[#024ad8] shadow-[0_0_8px_rgba(2,74,216,0.9)] transition-transform duration-300 group-hover:scale-125"></span>
          <span>Blockchain Verified</span>
        </span>
      </div>
    </div>

  </div>

  <!-- Right panel - Login form -->
  <div class="flex items-center justify-center bg-white px-6 py-12 sm:px-12">
    <div class="w-full max-w-md">
      <!-- Mobile logo -->
      <div class="mb-10 flex items-center gap-4 lg:hidden">
        <img src="assets/daire.png" alt="DAIRE" class="h-12 w-12 rounded-xl object-cover shadow-lg shadow-[#024ad8]/20">
        <div class="leading-none">
          <strong class="block text-sm font-bold tracking-[0.2em] text-[#1a1a1a]">DAIRE</strong>
          <small class="mt-2 block text-[11px] font-medium tracking-wide text-[#9a9a9a]">Credit Intelligence</small>
        </div>
      </div>

      <!-- Header -->
      <h2 class="mt-3 w-full text-center text-4xl font-bold tracking-tight text-[#1a1a1a]">Welcome back</h2>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-10 space-y-5" id="login-form">
        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-[#3d3d3d]" for="username-input">Username</label>
          <input id="username-input"
            formControlName="username"
            autocomplete="username"
            class="input-field"
            placeholder="Enter your username">
        </div>

        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-[#3d3d3d]" for="password-input">Password</label>
          <input id="password-input"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            class="input-field"
            placeholder="Enter your password">
        </div>

        @if (error) {
          <div class="flex items-center gap-3 rounded-xl border border-[rgb(179,38,43,0.3)] bg-[#f9d4d2] px-4 py-3 text-sm text-[#b3262b]">
            <svg class="size-4 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
            {{ error }}
          </div>
        }

        <button type="submit" id="login-submit"
          class="btn-primary w-full py-3.5 text-base mt-2"
          [disabled]="form.invalid || loading">
          @if (loading) {
            <svg class="size-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            Signing in...
          } @else {
            Sign in
          }
        </button>
      </form>
    </div>
  </div>
</section>
