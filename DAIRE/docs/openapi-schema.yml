openapi: 3.0.3
info:
  title: DAIRE Central System API
  version: 1.1.0
  description: |-
    Consent-aware lender integration and assessment orchestration API.

    The lender network is **NMB (LDR-NMB-02) and CRDB (LDR-CRDB-01) only** — pushes from any other lender_id are rejected. Lenders merge on `nida_number`: the same person at both banks becomes ONE central borrower and a single assessment scores the merged profile.

    Machine-checkable schema of record: `docs/openapi-schema.yml` (regenerate with `./export_openapi.sh`). Human-readable contracts: `docs/API_ENDPOINTS.md` and `DAIRE/LENDER_SUBSYSTEM_README.md`.
