components:
  schemas:
    AIReputationResult:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assessment_reference:
          type: string
          readOnly: true
        borrower_name:
          type: string
          readOnly: true
        borrower_reference:
          type: string
          readOnly: true
        score_explanation:
          type: string
          readOnly: true
        decision:
          type: string
          readOnly: true
        credit_grade:
          type: string
          readOnly: true
        credit_tier:
          type: string
          readOnly: true
        nmb_credit_score:
          type: string
          readOnly: true
        concordance:
          type: string
          readOnly: true
        ensemble_pd:
          type: string
          readOnly: true
        ml_pd:
          type: string
          readOnly: true
        nmb_pd:
          type: string
          readOnly: true
        recommended_credit_limit:
          type: string
          readOnly: true
        recommended_apr:
          type: string
          readOnly: true
        expected_loss:
          type: string
          readOnly: true
        actionable_guidance:
          type: string
          readOnly: true
        strengths:
          type: string
          readOnly: true
        risk_factors:
          type: string
          readOnly: true
        ml_weight:
          type: string
          readOnly: true
        nmb_weight:
          type: string
          readOnly: true
        history_band:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        reputation:
          type: string
          maxLength: 30
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,4})?$
        risk_level:
          type: string
          maxLength: 30
        behavior_summary:
          type: string
        model_version:
          type: string
          maxLength: 64
        raw_result: {}
        assessment:
          type: integer
      required:
      - actionable_guidance
      - assessment
      - assessment_reference
      - borrower_name
      - borrower_reference
      - concordance
      - created_at
      - credit_grade
      - credit_tier
      - decision
      - ensemble_pd
      - expected_loss
      - history_band
      - id
      - ml_pd
      - ml_weight
      - model_version
      - nmb_credit_score
      - nmb_pd
      - nmb_weight
      - recommended_apr
      - recommended_credit_limit
      - reputation
      - risk_factors
      - score
      - score_explanation
      - strengths
      - updated_at
    ActionFlagEnum:
      enum:
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `1` - Addition
        * `2` - Change
        * `3` - Deletion
    AdminLogEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action_time:
          type: string
          format: date-time
          readOnly: true
        username:
          type: string
          readOnly: true
        app_label:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
          nullable: true
        object_repr:
          type: string
          readOnly: true
        action_flag:
          allOf:
          - $ref: '#/components/schemas/ActionFlagEnum'
          readOnly: true
        change_message:
          type: string
          readOnly: true
      required:
      - action_flag
      - action_time
      - app_label
      - change_message
      - id
      - model
      - object_id
      - object_repr
      - username
    ApiStatusEnum:
      enum:
      - CONNECTED
      - DEGRADED
      - DISCONNECTED
      type: string
      description: |-
        * `CONNECTED` - Connected
        * `DEGRADED` - Degraded
        * `DISCONNECTED` - Disconnected
    Assessment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        borrower_reference:
          type: string
          readOnly: true
        applied_loan_amount:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        assessment_reference:
          type: string
          maxLength: 64
